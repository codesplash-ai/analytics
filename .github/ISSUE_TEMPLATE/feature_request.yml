name: Suggest a feature
description: Tell us what you'd like CodeSplash Analytics to do.
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: Describe the job you have to get done, rather than a particular solution.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: What you use now, and where it falls short.
    validations:
      required: false
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: If you have an idea of what this could look like, describe it here.
    validations:
      required: false
